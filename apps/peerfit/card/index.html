<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>串門運動 — 收卡</title>
<style>body{margin:0;background:#F6F1E7;color:#1F1B16;font:20px/1.6 -apple-system,"PingFang TC",sans-serif}.wrap{max-width:520px;margin:0 auto;padding:40px 22px;text-align:center}
h1{font-size:30px;margin:0 0 10px}.btn{display:block;background:#D9662B;color:#fff;text-decoration:none;font-weight:800;font-size:22px;border-radius:18px;padding:22px 16px;margin:18px 0}
.btn.s{background:#FFFBF3;color:#1F1B16;border:2.5px solid #1F1B16}.muted{color:#5A5248;font-size:16px}</style></head><body><div class="wrap">
<h1>朋友傳了一張運動卡給你</h1>
<p>這張卡裡是你的體能等級和運動安排。請先安裝「串門運動」，再回來按下面的按鈕收卡。</p>
<a class="btn" id="open" href="#">我裝好了，收卡</a>
<a class="btn s" href="https://apps.apple.com/app/id0000000000">還沒裝 → 去 App Store</a>
<p class="muted">資料只在你和朋友的手機之間傳，這個網頁不會存任何東西。</p>
</div>
<script>
// The payload is in the URL fragment; hand it to the app via its custom scheme (fallback when Universal Links are not yet verified).
var h=location.hash.replace(/^#/,'');var a=document.getElementById('open');
a.href=h?('peerfit:'+h):'peerfit:';
</script></body></html>
